    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f6f9; padding: 20px; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        .container { width: 100%; max-width: 500px; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
        
        .banner-header { 
            background: linear-gradient(180deg, #ffffff 0%, #f0f4f8 100%);
            border: 3px solid #0d47a1;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .main-title { font-size: 24px; font-weight: 900; color: #0d47a1; text-transform: uppercase; }
        .main-title span { color: #b71c1c; display: block; font-size: 26px; }
        
        .header-cursive-names {

            border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(40,167,69,0.3);
        }
        .btn-download:hover { background: #218838; }
    </style>
</head>
<body>

</script>

</body>
</html>
