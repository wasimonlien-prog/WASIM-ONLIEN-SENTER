<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASIM ONLINE CENTRE - Photo & Document Upload</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        h1 {
            color: #38bdf8;
            font-size: 24px;
            margin-bottom: 8px;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .upload-box {
            border: 2px dashed #38bdf8;
            border-radius: 12px;
            padding: 30px 20px;
            cursor: pointer;
            background: rgba(56, 189, 248, 0.05);
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        .upload-box:hover {
            background: rgba(56, 189, 248, 0.15);
        }
        .upload-icon {
            font-size: 40px;
            margin-bottom: 10px;
            display: block;
        }
        input[type="file"] {
            display: none;
        }
        .btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s ease;
        }
        .btn:hover {
            background: #0369a1;
        }
        #file-name {
            margin-top: 10px;
            font-size: 14px;
            color: #4ade80;
            word-break: break-all;
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }
        .status.success {
            color: #4ade80;
        }
        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>WASIM ONLINE CENTRE</h1>
    <p class="subtitle">अपनी फोटो या डॉक्यूमेंट यहाँ अपलोड करें</p>

    <div class="upload-box" onclick="document.getElementById('file-input').click()">
        <span class="upload-icon">📁</span>
        <p>फोटो/फाइल चुनने के लिए क्लिक करें</p>
        <div id="file-name"></div>
    </div>

    <input type="file" id="file-input" onchange="showFileName()">
    <button class="btn" onclick="uploadFile()">अपलोड करें (Upload Now)</button>

    <div id="status-msg" class="status"></div>

    <div class="footer">
        © WASIM ONLINE CENTRE - Rupauli
    </div>
</div>

<script>
    function showFileName() {
        const input = document.getElementById('file-input');
        const fileNameDiv = document.getElementById('file-name');
        if(input.files.length > 0) {
            fileNameDiv.textContent = "चयनित फाइल: " + input.files[0].name;
        }
    }

    function uploadFile() {
        const input = document.getElementById('file-input');
        const statusDiv = document.getElementById('status-msg');
        
        if (input.files.length === 0) {
            alert('कृपया पहले कोई फोटो या फाइल चुनें!');
            return;
        }

        statusDiv.style.display = 'block';
        statusDiv.className = 'status success';
        statusDiv.textContent = 'फाइल सफलता पूर्वक भेजी जा चुकी है! धन्यवाद।';

        setTimeout(() => {
            input.value = '';
            document.getElementById('file-name').textContent = '';
        }, 3000);
    }
</script>

</body>
</html>
