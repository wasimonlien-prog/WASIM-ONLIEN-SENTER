<script>
  // आपका सारा जावास्क्रिप्ट कोड यहाँ होना चाहिए
  fetch("YOUR_WEB_APP_URL", {
    method: "POST",
    body: JSON.stringify({ ... })
  })
  .then(async response => {
    const text = await response.text();
    console.log("Server response:", text);
    let result;
    try {
      result = JSON.parse(text);
    } catch (error) {
      throw new Error("सर्वर ने JSON जवाब नहीं दिया: " + text.slice(0, 100));
    }
    if (result.status === "success") {
      // सफलता का कोड
    } else {
      // एरर का कोड
    }
  })
  .catch(error => {
    console.error("Upload error:", error);
  });
</script>
