<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASIM ONLINE CENTRE</title>
    <!-- Strong Cursive Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; }
        body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        
        .box { max-width: 420px; width: 100%; background: #1e293b; padding: 30px 25px; border-radius: 16px; border: 1.5px solid #38bdf8; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .shop-title { color: #38bdf8; font-size: 24px; font-weight: 800; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1.5px; }
        
        .cursive-names { 
            font-family: 'Dancing Script', cursive !important; 
            font-size: 42px; 
            color: #38bdf8; 
            margin-bottom: 15px; 
            font-weight: bold;
        }
        .cursive-names .amp { color: #f8fafc; font-size: 32px; margin: 0 5px; }
        
        /* Customer Welcome Message */
        .customer-welcome {
            background: rgba(56, 189, 248, 0.1);
            border: 1px dashed #38bdf8;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        .customer-welcome h3 { color: #38bdf8; font-size: 15px; margin-bottom: 4px; }
        .customer-welcome p { color: #cbd5e1; font-size: 13px; font-weight: 400; line-height: 1.4; }

        .file-box { border: 2px dashed #38bdf8; padding: 20px; border-radius: 10px; background: #0f172a; margin-bottom: 20px; cursor: pointer; }
        input[type="file"] { width: 100%; color: #94a3b8; cursor: pointer; }
        
        button { background: #22c55e; color: #fff; font-size: 17px; font-weight: bold; border: none; padding: 14px; border-radius: 10px; cursor: pointer; width: 100%; transition: 0.3s; }
        button:hover { background: #16a34a; }
        
        #msg { margin-top: 18px; font-weight: bold; font-size: 15px; }
        .footer-text { margin-top: 22px; color: #64748b; font-size: 12px; border-top: 1px solid #334155; padding-top: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    </style>
</head>
<body>

<div class="box">
    <div class="shop-title">WASIM ONLINE CENTRE</div>
    
    <div class="cursive-names">
        Wasim <span class="amp">&</span> Neha
    </div>
    
    <!-- Customer Welcome Message -->
    <div class="customer-welcome">
        <h3>👋 प्रिय ग्राहक, आपका स्वागत है!</h3>
        <p>अपनी हाई-क्वालिटी फोटो या डॉक्यूमेंट चुनें और सबमिट करें। आपकी फाइल सुरक्षित सीधे हमारे पास पहुँचेगी।</p>
    </div>
    
    <div class="file-box">
        <input type="file" id="fileInput" accept="image/*,.pdf">
    </div>
    
    <button onclick="uploadFile()">सबमिट करें (Submit) 🚀</button>

    <div id="msg"></div>
    
    <div class="footer-text">
        WASIM & NEHA DIGITAL SEVA CENTRE
    </div>
</div>

<script>
    // 🔗 Aapka Sahi Web App URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyBJJpdyO7yZPfhOly2a6Q09K1XKvop5pnVIShV-H3I-5thTd3L0OA61giHbqNh-PqdFQ/exec";

    function uploadFile() {
        const fileInput = document.getElementById('fileInput');
        const msg = document.getElementById('msg');
        if (!fileInput.files[0]) {
            alert("कृपया फोटो या फाइल चुनें!");
            return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        msg.style.color = "#38bdf8";
        msg.innerText = "⚡ रॉकेट स्पीड से फाइल भेजी जा रही है...";

        reader.onload = function(e) {
            const rawLog = e.target.result.split(',')[1];
            const data = {
                action: "upload",
                fileName: file.name,
                mimeType: file.type,
                fileData: rawLog
            };

            // Instant non-blocking request for zero delay
            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify(data)
            });

            // Immediate success prompt so customer doesn't wait
            msg.style.color = "#22c55e";
            msg.innerText = "✅ फाइल सफलतापूर्वक सबमिट हो गई है!";
            fileInput.value = "";
        };
        reader.readAsDataURL(file);
    }
</script>

</body>
</html>
