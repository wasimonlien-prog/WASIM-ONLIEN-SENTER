<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASIM ONLINE CENTRE - Admin Dashboard</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 20px auto; background: #1e293b; padding: 25px; border-radius: 16px; border: 1px solid #334155; }
        h2 { color: #38bdf8; text-align: center; margin-top: 0; }
        .login-box { max-width: 340px; margin: 100px auto; background: #1e293b; padding: 30px; border-radius: 16px; border: 2px solid #38bdf8; text-align: center; }
        input[type="password"] { padding: 12px; width: 100%; border-radius: 8px; border: 1px solid #38bdf8; background: #0f172a; color: #fff; margin-bottom: 15px; outline: none; font-size: 16px; }
        .btn-main { background: #38bdf8; color: #0f172a; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; }
        .btn-refresh { background: #38bdf8; color: #0f172a; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 14px; border-bottom: 1px solid #334155; text-align: left; }
        th { background: #0f172a; color: #38bdf8; border-radius: 4px; }
        a.btn-down { background: #22c55e; color: #fff; text-decoration: none; padding: 8px 14px; border-radius: 6px; font-size: 14px; font-weight: bold; display: inline-block; }
        a.btn-down:hover { background: #16a34a; }
    </style>
</head>
<body>

<!-- Login Section -->
<div id="loginSection" class="login-box">
    <h2>🔒 WASIM ADMIN</h2>
    <p style="color: #94a3b8; font-size: 14px;">दुकान का डैशबोर्ड खोलने के लिए पासवर्ड डालें</p>
    <input type="password" id="passInput" placeholder="पासवर्ड डालें">
    <button onclick="login()" class="btn-main">लॉगिन करें 🚀</button>
</div>

<!-- Admin Dashboard Section -->
<div id="adminDashboard" class="container" style="display:none;">
    <h2>📥 कस्टमर द्वारा भेजी गई फोटो व फाइलें</h2>
    <button onclick="loadFiles()" class="btn-refresh">🔄 लिस्ट रिफ्रेश करें</button>
    
    <table>
        <thead>
            <tr>
                <th>फाइल का नाम</th>
                <th>तारीख / समय</th>
                <th>डाउनलोड / देखें</th>
            </tr>
        </thead>
        <tbody id="fileTable">
            <tr><td colspan="3">डेटा लोड हो रहा है...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzWZHBxXbvUfLU4FB_EvVcErCrOt4_ZyruBTNYNAYBT_sFP88uqNS8G0A0oxYhqcHjs/exec";
    const MY_PASSWORD = "wasim123"; // 👈 पासवर्ड यहाँ से बदल सकते हैं

    function login() {
        const pass = document.getElementById('passInput').value;
        if (pass === MY_PASSWORD) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminDashboard').style.display = 'block';
            loadFiles();
        } else {
            alert("गलत पासवर्ड!");
        }
    }

    function loadFiles() {
        const table = document.getElementById('fileTable');
        table.innerHTML = "<tr><td colspan='3'>फाइलें चेक की जा रही हैं...</td></tr>";

        fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({ action: "fetch" })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === "success" && data.files.length > 0) {
                table.innerHTML = "";
                data.files.reverse().forEach(file => {
                    table.innerHTML += `
                        <tr>
                            <td><b>${file.name}</b></td>
                            <td style="color: #94a3b8;">${file.date}</td>
                            <td><a href="${file.url}" target="_blank" class="btn-down">देखें / डाउनलोड 📥</a></td>
                        </tr>
                    `;
                });
            } else {
                table.innerHTML = "<tr><td colspan='3'>अभी कोई नई फाइल नहीं आई है।</td></tr>";
            }
        })
        .catch(() => {
            table.innerHTML = "<tr><td colspan='3'>डेटा लाने में समस्या आई, पुनः प्रयास करें।</td></tr>";
        });
    }
</script>

</body>
</html>
