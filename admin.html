<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASIM ONLINE CENTRE - Admin Panel</title>
    <!-- Strong Cursive Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; }
        body { background: #0f172a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        .box { max-width: 600px; width: 100%; background: #1e293b; padding: 25px; border-radius: 16px; border: 1.5px solid #38bdf8; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .shop-title { color: #38bdf8; font-size: 22px; font-weight: 800; text-align: center; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1.5px; }
        
        .cursive-names { 
            font-family: 'Dancing Script', cursive !important; 
            font-size: 36px; 
            color: #38bdf8; 
            text-align: center;
            margin-bottom: 20px; 
            font-weight: bold;
        }
        .cursive-names .amp { color: #f8fafc; font-size: 28px; margin: 0 5px; }

        .file-list { margin-top: 15px; }
        .file-item { background: #0f172a; padding: 12px 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
        .file-name { font-size: 14px; color: #cbd5e1; word-break: break-all; max-width: 60%; }
        
        .btn-group { display: flex; gap: 8px; }
        .btn-download { background: #22c55e; color: #fff; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: bold; }
        .btn-delete { background: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-delete:hover { background: #dc2626; }

        #status-msg { text-align: center; margin-top: 15px; font-weight: bold; font-size: 14px; color: #38bdf8; }
    </style>
</head>
<body>

<div class="box">
    <div class="shop-title">WASIM ONLINE CENTRE</div>
    <div class="cursive-names">
        Wasim <span class="amp">&</span> Neha
    </div>

    <h3 style="font-size: 16px; color: #38bdf8; margin-bottom: 10px; text-align: center;">📁 ग्राहकों द्वारा भेजी गई फाइलें (Admin Panel)</h3>
    
    <div id="status-msg">फाइलें लोड हो रही हैं...</div>
    <div class="file-list" id="fileList"></div>
</div>

<script>
    // 🔗 Aapka Sahi Web App URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyBJJpdyO7yZPfhOly2a6Q09K1XKvop5pnVIShV-H3I-5thTd3L0OA61giHbqNh-PqdFQ/exec";

    function loadFiles() {
        const msg = document.getElementById('status-msg');
        msg.innerText = "फाइलें लोड हो रही हैं...";

        fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
            const listDiv = document.getElementById('fileList');
            listDiv.innerHTML = "";
            
            if(!data || data.length === 0) {
                msg.innerText = "कोई फाइल उपलब्ध नहीं है।";
                return;
            }
            
            msg.innerText = "";
            data.forEach(file => {
                const item = document.createElement('div');
                item.className = "file-item";
                item.id = "file-" + file.id;
                
                item.innerHTML = `
                    <span class="file-name">${file.name}</span>
                    <div class="btn-group">
                        <a href="${file.url}" target="_blank" class="btn-download">डाउनलोड</a>
                        <button class="btn-delete" onclick="deleteFile('${file.id}')">डिलीट</button>
                    </div>
                `;
                listDiv.appendChild(item);
            });
        })
        .catch(() => {
            document.getElementById('status-msg').innerText = "❌ फाइलें लोड करने में समस्या आई। कृपया रिफ्रेश करें।";
        });
    }

    // Instant Superfast Delete
    function deleteFile(fileId) {
        if(!confirm("क्या आप वाकई इस फाइल को डिलीट करना चाहते हैं?")) return;

        const row = document.getElementById("file-" + fileId);
        if(row) row.style.display = "none";

        fetch(SCRIPT_URL + "?id=" + fileId, {
            method: "GET",
            mode: "no-cors"
        }).catch(() => {});
    }

    loadFiles();
</script>

</body>
</html>
