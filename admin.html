<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASIM ONLINE CENTRE - Admin Panel</title>
    <!-- Strong Cursive Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; }
        body { background: #0f172a; color: #ffffff; min-height: 100vh; padding-bottom: 40px; }
        
        .header { background: #1e293b; padding: 15px 25px; border-bottom: 2px solid #38bdf8; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.4); flex-wrap: wrap; gap: 10px; }
        .header-title { font-size: 20px; color: #38bdf8; font-weight: 800; letter-spacing: 1px; }
        .header-cursive { font-family: 'Dancing Script', cursive !important; font-size: 34px; color: #38bdf8; font-weight: bold; }
        .header-cursive .amp { color: #f8fafc; font-size: 26px; }

        .main-content { padding: 40px 15px; display: flex; justify-content: center; }
        .login-card { background: #1e293b; width: 100%; max-width: 380px; padding: 35px 25px; border-radius: 16px; border: 1.5px solid #38bdf8; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .login-card h2 { color: #38bdf8; font-size: 22px; margin-bottom: 5px; font-weight: 700; }
        .login-card p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        input[type="password"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #38bdf8; background: #0f172a; color: #fff; margin-bottom: 18px; font-size: 16px; outline: none; text-align: center; }
        
        .dashboard-card { background: #1e293b; width: 100%; max-width: 950px; padding: 25px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.4); overflow-x: auto; }
        .dash-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #334155; flex-wrap: wrap; gap: 10px; }
        
        .btn-main { background: #38bdf8; color: #0f172a; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; transition: 0.3s; }
        .btn-main:hover { background: #0284c7; color: #fff; }
        .btn-refresh { background: #22c55e; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.3s; box-shadow: 0 0 10px rgba(34, 197, 94, 0.4); }
        .btn-refresh:hover { background: #16a34a; }
        
        /* एक्शन बॉक्स और बटन की परफेक्ट सीध */
        .action-cell { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
        
        .btn-download { background: #22c55e; color: #fff; text-decoration: none; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: bold; display: inline-block; transition: 0.3s; box-shadow: 0 2px 6px rgba(34, 197, 94, 0.4); white-space: nowrap; }
        .btn-download:hover { background: #16a34a; }
        
        .btn-delete { background: #ef4444; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 2px 6px rgba(239, 68, 68, 0.4); white-space: nowrap; }
        .btn-delete:hover { background: #dc2626; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; min-width: 750px; table-layout: fixed; }
        th, td { padding: 14px 16px; border-bottom: 1px solid #334155; text-align: left; font-size: 14px; word-wrap: break-word; vertical-align: middle; }
        th { background: #0f172a; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.5px; font-size: 12px; }
        tr:hover { background: rgba(51, 65, 85, 0.3); }
        td { color: #e2e8f0; }
    </style>
</head>
<body>

<div class="header">
    <div class="header-title">WASIM ONLINE CENTRE</div>
    <div class="header-cursive">
        Wasim <span class="amp">&</span> Neha
    </div>
</div>

<div class="main-content">
    <div id="loginSection" class="login-card">
        <h2>ADMIN LOGIN</h2>
        <div class="header-cursive" style="margin: 5px 0 15px 0;">
            Wasim <span class="amp">&</span> Neha
        </div>
        <p>डैशबोर्ड खोलने के लिए अपना पासवर्ड दर्ज करें</p>
        <input type="password" id="passInput" placeholder="पासवर्ड यहाँ डालें">
        <button onclick="login()" class="btn-main">लॉगिन करें 🚀</button>
    </div>

    <div id="adminDashboard" class="dashboard-card" style="display:none;">
        <div class="dash-top">
            <h3 style="color:#f8fafc; font-size: 18px;">📥 कस्टमर द्वारा भेजी गई नई फाइलें</h3>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span id="syncStatus" style="font-size: 12px; color: #34d399;">🛡️ बंडल मोड एक्टिव</span>
                <button id="refreshBtn" onclick="lightningRefresh()" class="btn-refresh">⚡ सुपरफास्ट रिफ्रेश</button>
            </div>
        </div>
        
        <table>
            <colgroup>
                <col style="width: 42%;">
                <col style="width: 33%;">
                <col style="width: 25%;">
            </colgroup>
            <thead>
                <tr>
                    <th>फाइल का नाम</th>
                    <th>तारीख और समय</th>
                    <th>एक्शन</th>
                </tr>
            </thead>
            <tbody id="fileTable">
                <tr><td colspan="3" style="text-align:center; color:#94a3b8;">डेटा लोड हो रहा है...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyBJJpdyO7yZPfhOly2a6Q09K1XKvop5pnVIShV-H3I-5thTd3L0OA61giHbqNh-PqdFQ/exec";
    const MY_PASSWORD = "Moon@1234";

    function login() {
        const pass = document.getElementById('passInput').value;
        if (pass === MY_PASSWORD) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminDashboard').style.display = 'block';
            
            // 1. तुरंत पुराना कैशे एक साथ दिखाओ[span_2](start_span)[span_2](end_span)
            const cached = localStorage.getItem('wasim_rocket_cache');
            if (cached) {
                renderTable(JSON.parse(cached));
            }
            
            // 2. तुरंत ताजा डेटा फेच करो
            fetchFiles(false);

        } else {
            alert("❌ गलत पासवर्ड! कृपया सही पासवर्ड दर्ज करें।");
        }
    }

    // 🚀 एक साथ सारी फाइलों को बंडल बनाकर टेबल में डालने का सॉलिड तरीका
    function renderTable(files) {
        const table = document.getElementById('fileTable');
        if (!files || files.length === 0) {
            table.innerHTML = "<tr><td colspan='3' style='text-align:center; color:#94a3b8;'>अभी कोई नई फाइल नहीं आई है।</td></tr>";
            return;
        }
        
        let allRowsHtml = "";
        files.forEach(file => {
            allRowsHtml += `
                <tr id="row-${file.id}">
                    <td><b>📄 ${file.name}</b></td>
                    <td style="color:#94a3b8;">🕒 ${file.date}</td>
                    <td>
                        <div class="action-cell">
                            <a href="${file.url}" target="_blank" class="btn-download">डाउनलोड 📥</a>
                            <button onclick="deleteFile('${file.id}', '${file.name}')" class="btn-delete">डिलीट ❌</button>
                        </div>
                    </td>
                </tr>
            `;
        });
        table.innerHTML = allRowsHtml; // सारी फाइलें एक ही झटके में एक साथ प्रकट होंगी!
    }

    function fetchFiles(isManual) {
        const refBtn = document.getElementById('refreshBtn');
        const syncStatus = document.getElementById('syncStatus');
        
        if(isManual) {
            refBtn.innerText = "⏳ एकसाथ लोड हो रहा है...";
        }

        const uniqueUrl = SCRIPT_URL + "?t=" + new Date().getTime();

        fetch(uniqueUrl, {
            method: "POST",
            body: JSON.stringify({ action: "fetch" })
        })
        .then(res => res.json())
        .then(data => {
            if(isManual) {
                refBtn.innerText = "⚡ सुपरफास्ट रिफ्रेश";
            }
            if (data.status === "success" && data.files) {
                const reversed = data.files.reverse();
                localStorage.setItem('wasim_rocket_cache', JSON.stringify(reversed));
                renderTable(reversed); // एक साथ पूरा बंडल रेंडर होगा
                syncStatus.innerText = "🛡️ बंडल मोड एक्टिव";
            }
        })
        .catch(() => {
            if(isManual) {
                refBtn.innerText = "⚡ सुपरफास्ट रिफ्रेश";
            }
            syncStatus.innerText = "⚠️ कनेक्शन त्रुटि";
        });
    }

    // ⚡ Lightning Refresh (Manual Click)
    function lightningRefresh() {
        fetchFiles(true);
    }

    // 🔥 Superfast Instant Delete (Zero Delay on Screen)[span_3](start_span)[span_3](end_span)[span_4](start_span)[span_4](end_span)
    function deleteFile(fileId, fileName) {
        if (!confirm(`क्या आप वाकई "${fileName}" को डिलीट करना चाहते हैं?`)) {
            return;
        }

        // 1. तुरंत स्क्रीन से हटाओ[span_5](start_span)[span_5](end_span)
        const row = document.getElementById("row-" + fileId);
        if (row) {
            row.style.display = "none";
        }

        // 2. लोकल कैशे से तुरंत हटाओ[span_6](start_span)[span_6](end_span)
        const cached = localStorage.getItem('wasim_rocket_cache');
        if (cached) {
            let files = JSON.parse(cached);
            files = files.filter(f => f.id !== fileId);
            localStorage.setItem('wasim_rocket_cache', JSON.stringify(files));
        }

        // 3. बैकग्राउंड में सर्वर को डिलीट रिक्वेस्ट भेजो[span_7](start_span)[span_7](end_span)
        fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({ action: "delete", fileId: fileId })
        }).catch(() => {});
    }
</script>

</body>
</html>
