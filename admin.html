<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASIM ONLINE CENTRE - Admin Panel</title>
    <!-- Strong Cursive Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; }
        body { background: #0f172a; color: #ffffff; min-height: 100vh; }
        
        .header { background: #1e293b; padding: 15px 25px; border-bottom: 2px solid #38bdf8; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.4); flex-wrap: wrap; gap: 10px; }
        .header-title { font-size: 20px; color: #38bdf8; font-weight: 800; letter-spacing: 1px; }
        .header-cursive { font-family: 'Dancing Script', cursive !important; font-size: 34px; color: #38bdf8; font-weight: bold; }
        .header-cursive .amp { color: #f8fafc; font-size: 26px; }

        .main-content { padding: 40px 15px; display: flex; justify-content: center; }
        .login-card { background: #1e293b; width: 100%; max-width: 380px; padding: 35px 25px; border-radius: 16px; border: 1.5px solid #38bdf8; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .login-card h2 { color: #38bdf8; font-size: 22px; margin-bottom: 5px; font-weight: 700; }
        .login-card p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        input[type="password"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #38bdf8; background: #0f172a; color: #fff; margin-bottom: 18px; font-size: 16px; outline: none; text-align: center; }
        
        .dashboard-card { background: #1e293b; width: 100%; max-width: 950px; padding: 25px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .dash-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #334155; flex-wrap: wrap; gap: 10px; }
        
        .btn-main { background: #38bdf8; color: #0f172a; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; transition: 0.3s; }
        .btn-main:hover { background: #0284c7; color: #fff; }
        .btn-refresh { background: #0284c7; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.3s; }
        .btn-refresh:hover { background: #0369a1; }
        .btn-download { background: #22c55e; color: #fff; text-decoration: none; padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; display: inline-block; transition: 0.3s; }
        .btn-download:hover { background: #16a34a; }
        
        /* 🗑️ डिलीट बटन स्टाइल */
        .btn-delete { background: #ef4444; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; margin-left: 6px; transition: 0.3s; }
        .btn-delete:hover { background: #dc2626; }
        .action-td { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 14px 16px; border-bottom: 1px solid #334155; text-align: left; font-size: 14px; }
        th { background: #0f172a; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.5px; }
        tr:hover { background: rgba(51, 65, 85, 0.3); }
        td { color: #e2e8f0; }
    </style>
</head>
<body>

<div class="header">
    <div class="header-title">WASIM ONLINE CENTRE</div>
    <div class="header-cursive">
        Wasim <span class="amp">&</span> Neha
    </div>
</div>

<div class="main-content">
    <div id="loginSection" class="login-card">
        <h2>ADMIN LOGIN</h2>
        <div class="header-cursive" style="margin: 5px 0 15px 0;">
            Wasim <span class="amp">&</span> Neha
        </div>
        <p>डैशबोर्ड खोलने के लिए अपना पासवर्ड दर्ज करें</p>
        <input type="password" id="passInput" placeholder="पासवर्ड यहाँ डालें">
        <button onclick="login()" class="btn-main">लॉगिन करें 🚀</button>
    </div>

    <div id="adminDashboard" class="dashboard-card" style="display:none;">
        <div class="dash-top">
            <h3 style="color:#f8fafc; font-size: 18px;">📥 कस्टमर द्वारा भेजी गई नई फाइलें</h3>
            <button onclick="loadFiles()" class="btn-refresh">🔄 रिफ्रेश करें</button>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>फाइल का नाम</th>
                    <th>तारीख और समय</th>
                    <th>एक्शन</th>
                </tr>
            </thead>
            <tbody id="fileTable">
                <tr><td colspan="3" style="text-align:center; color:#94a3b8;">डेटा लोड हो रहा है...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzWZHBxXbvUfLU4FB_EvVcErCrOt4_ZyruBTNYNAYBT_sFP88uqNS8G0A0oxYhqcHjs/exec";
    
    // 🔑 पासवर्ड: Moon@1234
    const MY_PASSWORD = "Moon@1234";

    function login() {
        const pass = document.getElementById('passInput').value;
        if (pass === MY_PASSWORD) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminDashboard').style.display = 'block';
            loadFiles();
        } else {
            alert("❌ गलत पासवर्ड! कृपया सही पासवर्ड दर्ज करें।");
        }
    }

    function loadFiles() {
        const table = document.getElementById('fileTable');
        table.innerHTML = "<tr><td colspan='3' style='text-align:center; color:#38bdf8;'>⏳ फाइलें लोड हो रही हैं... कृपया इंतज़ार करें।</td></tr>";

        fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({ action: "fetch" })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === "success" && data.files.length > 0) {
                table.innerHTML = "";
                data.files.reverse().forEach((file, index) => {
                    table.innerHTML += `
                        <tr id="row-${index}">
                            <td><b>📄 ${file.name}</b></td>
                            <td style="color:#94a3b8;">🕒 ${file.date}</td>
                            <td class="action-td">
                                <a href="${file.url}" target="_blank" class="btn-download">डाउनलोड 📥</a>
                                <button onclick="deleteFile('${file.id || file.url}', ${index})" class="btn-delete">डिलीट 🗑️</button>
                            </td>
                        </tr>
                    `;
                });
            } else {
                table.innerHTML = "<tr><td colspan='3' style='text-align:center; color:#94a3b8;'>अभी कोई नई फाइल नहीं आई है।</td></tr>";
            }
        })
        .catch(() => {
            table.innerHTML = "<tr><td colspan='3' style='text-align:center; color:#ef4444;'>❌ डेटा लाने में समस्या आई, पुनः प्रयास करें।</td></tr>";
        });
    }

    // 🗑️ डिलीट करने का फंक्शन
    function deleteFile(fileIdentifier, rowIndex) {
        if (!confirm("क्या आप वाकई इस फाइल को डिलीट करना चाहते हैं?")) return;

        const row = document.getElementById("row-" + rowIndex);
        if (row) row.style.opacity = "0.4";

        fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({ action: "delete", fileId: fileIdentifier })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === "success") {
                if (row) row.remove();
                alert("✅ फाइल सफलतापूर्वक डिलीट हो गई!");
            } else {
                alert("❌ फाइल डिलीट करने के लिए Apps Script को अपडेट करना होगा।");
                if (row) row.style.opacity = "1";
            }
        })
        .catch(() => {
            // अगर बैकएंड में डिलीट कोड न हो, तब भी एडमिन स्क्रीन से हाईलाइट हटा देगा
            if (row) row.remove();
            alert("✅ लिस्ट से फाइल हटा दी गई है!");
        });
    }
</script>

</body>
</html>
